version: '3.8'

# ==========================================
# Development Environment
# ==========================================
# This configuration is for LOCAL DEVELOPMENT ONLY
# For production, use: docker-compose -f docker-compose.prod.yml up

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: aoe2_db_dev
    environment:
      POSTGRES_DB: aoe2_web
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aoe2_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: aoe2_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aoe2_network

  # Django Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aoe2_backend_dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - ./server:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aoe2_network
    restart: unless-stopped

  # Celery Worker
  celery:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aoe2_celery_dev
    command: celery -A core worker -l info
    volumes:
      - ./server:/app
    env_file:
      - ./server/.env.development
    depends_on:
      - db
      - redis
    networks:
      - aoe2_network
    restart: unless-stopped

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aoe2_celery_beat_dev
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./server:/app
    env_file:
      - ./server/.env.development
    depends_on:
      - db
      - redis
    networks:
      - aoe2_network
    restart: unless-stopped

  # Vue Frontend (Development)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: aoe2_frontend_dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - aoe2_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  aoe2_network:
    driver: bridge
